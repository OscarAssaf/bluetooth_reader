# separate terms of service, privacy policy, and support
# documentation.

name: Flutter pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
 
jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
 
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
 
      - name: Install dependencies
        run: flutter pub get
 
      - name: Analyze
        run: flutter analyze
 
      - name: Run tests
        run: flutter test
 